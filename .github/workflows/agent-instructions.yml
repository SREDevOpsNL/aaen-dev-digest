# agent-instructions — the repository side of the AGENTS.md contract.
# The five canonical project/package AGENTS.md files are regular files with
# resolvable links and an explicit hierarchy; each has a CLAUDE.md symlink to
# it, and no other CLAUDE-style file shadows them. Skill-local files such as
# .claude/skills/*/AGENTS.md are out of scope. Also runs the pr-self-review
# router's fixture tests. No dependencies: plain Node.
#
# Deliberately not path-filtered: a shadowing file or a renamed link target can
# arrive in any change, and the check takes seconds.
name: agent-instructions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-instructions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/verify-agent-instructions.mjs

      - run: node --test .claude/skills/pr-self-review/scripts/route-diff.test.mjs
